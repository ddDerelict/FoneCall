name: Build and Sign WinForms App

on:
  push:
    tags:
      - 'v*' # Triggers the workflow whenever you push a version tag like v1.0.0

permissions:
  contents: write
  id-token: write # Required for OIDC authentication with Azure

jobs:
  build:
    runs-on: windows-latest # Windows environment is required for MSBuild and Inno Setup

    steps:
    # 1. Check out the source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup .NET SDK for WinForms compilation
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust this to your specific .NET version

    # 3. Restore dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 4. Compile the Windows Forms app in Release mode
    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    # 5. Log into Azure using GitHub OIDC
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 6. Configure Azure Trusted Signing dlib and integration tools
    - name: Setup Azure Trusted Signing
      uses: azure/trusted-signing-action@v0.3.1 # Uses Azure Artifact Signing integrations
      with:
        endpoint: 'https://wus2.codesigning.azure.net/' # Replace with your specific regional Azure signing endpoint URI
        trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}

    # 7. Compile the installer using Inno Setup
    # This automatically invokes the SignTool setup inside your .iss script
    - name: Compile Installer with Inno Setup
      uses: jenkey2011/inno-setup-action@v1
      with:
        filepath: 'YOUR_INNO_SCRIPT.iss' # Path to your .iss script relative to repository root

    # 8. Archive the generated artifact
    - name: Upload Signed Installer
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Windows-Installer
        path: Output/*.exe # Adjust to your Inno Setup output directory

